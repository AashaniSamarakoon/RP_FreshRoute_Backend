name: Deploy Freshroute Backend

on:
  push:
    branches:
      - deployment
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy. Leave empty to deploy the selected branch.
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          DEPLOY_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"

          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "DEPLOY_BRANCH=$DEPLOY_BRANCH bash -s" << 'EOF'
            set -e

            echo "Pulling latest code..."
            cd /var/www/freshroute-api
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git pull origin "$DEPLOY_BRANCH"

            echo "Installing backend dependencies..."
            cd /var/www/freshroute-api/Backend

            SWAP_FILE=/tmp/freshroute-deploy.swap
            if ! swapon --show | grep -q "$SWAP_FILE"; then
              echo "Creating temporary swap for npm install..."
              sudo fallocate -l 2G "$SWAP_FILE" || sudo dd if=/dev/zero of="$SWAP_FILE" bs=1M count=2048
              sudo chmod 600 "$SWAP_FILE"
              sudo mkswap "$SWAP_FILE"
              sudo swapon "$SWAP_FILE"
            fi
            free -h

            npm ci --omit=dev --no-audit --no-fund || {
              echo "Clean install failed. Removing stale node_modules and retrying..."
              rm -rf node_modules
              npm ci --omit=dev --no-audit --no-fund
            }

            echo "Restarting PM2 backend..."
            pm2 restart freshroute-backend || pm2 start npm --name freshroute-backend -- start

            echo "Deployment complete."
          EOF
