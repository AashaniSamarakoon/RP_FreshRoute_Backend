# ---------------------------------------------------------------------------
# "PeerOrgs" - Definition of organizations managing peer nodes
# ---------------------------------------------------------------------------
PeerOrgs:
  # ---------------------------------------------------------------------------
  # FarmerOrg
  # ---------------------------------------------------------------------------
  - Name: FarmerOrg
    Domain: farmer.freshroute.com
    EnableNodeOUs: true

    # ---------------------------------------------------------------------------
    # "CA"
    # ---------------------------------------------------------------------------
    CA:
      Hostname: ca # implicitly ca.farmer.freshroute.com
      SANS:
        - localhost

    # ---------------------------------------------------------------------------
    # "Specs"
    # ---------------------------------------------------------------------------
    Template:
      Count: 2
      SANS:
        - localhost

    # ---------------------------------------------------------------------------
    # "Users"
    # ---------------------------------------------------------------------------
    Users:
      Count: 1
